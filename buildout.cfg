[buildout]
develop = .
parts = test coverage-test python

[test]
recipe = zc.recipe.testrunner
eggs = zope.index [test]

[coverage-test]
recipe = zc.recipe.testrunner
eggs = zope.index [test]
defaults = ['--coverage', '../../coverage']

[python]
recipe = zc.recipe.egg
eggs = zope.index
interpreter = python
